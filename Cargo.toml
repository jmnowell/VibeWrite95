[package]
name = "vibe-write-95"
version = "0.1.0"
edition = "2021"
description = "A WordStar-inspired terminal markdown editor"

[dependencies]
ratatui = "0.29"
crossterm = "0.28"
tui-textarea = "0.7"
pulldown-cmark = "0.12"
comrak = "0.36"
printpdf = "0.7"
levenshtein = "1.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
rand = "0.9"
clap = { version = "4", features = ["derive"] }
toml = "0.8"
